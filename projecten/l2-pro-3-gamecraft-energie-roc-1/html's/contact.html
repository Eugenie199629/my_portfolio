<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Energie ROC</title>
    <link rel="stylesheet" href="../css/contact.css">
    <link rel="stylesheet" media="screen and (max-width: 700px)" href="../responsive css/contact.css">
</head>

<body>
   <!-- Header -->
   <header class="header">
    <div class="logo">
        <img class="logofoto" src="../images/logo.png" alt="Energie ROC Logo">
        <h1 class="logonaam">Energie ROC</h1>
    </div>
    
    <!-- Hamburger Menu Icon -->
    <div class="hamburger" id="hamburger-menu">
        =<i class="fas fa-bars"></i> 
    </div>

    <nav class="buttons" id="nav-links">
        <div class="imgbuttons">
            <a href="../index.html">
                <img class="button" src="../images/button.png" alt="Home Button">
                <span class="text-in-button1">Home</span>
            </a>
        </div>
        <div class="imgbuttons">
            <a href="aboutgame.html">
                <img class="button" src="../images/button.png" alt="About Game Button">
                <span class="text-in-button2">About Game</span>
            </a>
        </div>
        <div class="imgbuttons">
            <a href="game.html">
                <img class="button" src="../images/button.png" alt="Games Button">
                <span class="text-in-button3">Games</span>
            </a>
        </div>
        <div class="imgbuttons">
            <a href="about-us.html">
                <img class="button" src="../images/button.png" alt="About Us Button">
                <span class="text-in-button4">About Us</span>
            </a>
        </div>
        <div class="imgbuttons">
            <a href="#">
                <img class="button" src="../images/button.png" alt="Games Button">
                <span class="text-in-button5">Contact</span>
            </a>
        </div>
    </nav>
</header>


    <!-- Contact Form -->
    <main>
        <section class="contact-form-section">
            <h2>Contacteer Ons</h2>
            <p>Heb je vragen of opmerkingen? Vul het formulier hieronder in en we nemen zo snel mogelijk contact met je op.</p>
            <form action="#" method="post" class="contact-form">
                <label for="name">Naam:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Bericht:</label>
                <textarea id="message" name="message" rows="4" required></textarea>

                <button type="submit">Verstuur</button>
            </form>
        </section>
    </main>

    <script>
        document.getElementById("hamburger-menu").addEventListener("click", function() {
            const navLinks = document.getElementById("nav-links");
            navLinks.classList.toggle("open");
        });
    </script>
    
</body>

</html>
